<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Nusibraižykite savo virtuvę: sudėkite spinteles, pasirinkite stalčius, dureles ir spalvas, peržiūrėkite 3D ir atsiųskite užklausą Dėdės Baldai.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Virtuvės eskizas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: workbench — catalogue rail | drawing board (wall elevation + floor plan) | inspector. Stacks on phones. */
:root{
  --bg:#F2F3EF; --panel:#FFFFFF; --ink:#1D2521; --muted:#67726C; --line:#D5DAD4;
  --accent:#2F5D50; --accent-ink:#FFFFFF; --accent-soft:#E1EBE6;
  --paper:#FAFBF8; --grid:rgba(47,93,80,.07); --wall:#ECEFEA; --hatch:#BFC7C0; --dim:#3B4842;
  --warn:#B4472B; --warn-soft:#F6E3DC; --glass:#CFE1E7; --steel:#A8AEAE;
  --font-ui:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131816; --panel:#1B221F; --ink:#E6ECE8; --muted:#95A29B; --line:#2D3833;
  --accent:#86C2AC; --accent-ink:#0E1412; --accent-soft:#21332C;
  --paper:#171E1B; --grid:rgba(134,194,172,.06); --wall:#202925; --hatch:#3B4741; --dim:#B9C6BF;
  --warn:#E98C6F; --warn-soft:#3A241D; --glass:#35505A; --steel:#8E9595; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131816; --panel:#1B221F; --ink:#E6ECE8; --muted:#95A29B; --line:#2D3833;
  --accent:#86C2AC; --accent-ink:#0E1412; --accent-soft:#21332C;
  --paper:#171E1B; --grid:rgba(134,194,172,.06); --wall:#202925; --hatch:#3B4741; --dim:#B9C6BF;
  --warn:#E98C6F; --warn-soft:#3A241D; --glass:#35505A; --steel:#8E9595; color-scheme:dark}

html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font-ui);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:flex;flex-direction:column;gap:12px;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 20px}

/* top bar */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand small{font:500 10.5px/1 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.brand h1{margin:0;font:800 21px/1.1 var(--font-ui);letter-spacing:-.015em;text-wrap:balance}
.grow{flex:1}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 11px;font-weight:500;font-size:13px;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default;border-color:var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--warn)}
.btn.danger.armed{background:var(--warn);color:var(--panel);border-color:var(--warn)}
.btn svg{width:15px;height:15px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:6px 10px;font-size:12.5px;font-weight:600;letter-spacing:.02em}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* workbench */
.work{display:grid;grid-template-columns:216px minmax(0,1fr) 340px;gap:12px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0}

/* catalogue */
.cat{padding:12px;display:flex;flex-direction:column;gap:14px;user-select:none;-webkit-user-select:none;position:sticky;top:12px}
.cat h3{margin:0 0 6px;font:600 10.5px/1 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cat .hint{font-size:12px;color:var(--muted);margin:0}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.citem{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:4px;touch-action:pan-x;min-width:0}
.citem:hover{border-color:var(--accent);background:var(--accent-soft)}
.citem svg{height:52px;width:100%;pointer-events:none}
.citem span{font-size:11px;line-height:1.2;text-align:center;font-weight:500;pointer-events:none}
.cgroup{display:flex;flex-direction:column}

/* board */
.board{display:flex;flex-direction:column;gap:10px;min-width:0}
.sheet{position:relative;padding:10px;background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:20px 20px;border:1px solid var(--line);border-radius:12px;min-width:0}
.sheet-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.wtabs{display:flex;gap:4px;flex-wrap:wrap}
.wtab{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600}
.wtab b{font:500 11.5px var(--font-mono);color:var(--muted);margin-left:6px}
.wtab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wtab[aria-pressed="true"] b{color:inherit;opacity:.7}
.sheet-label{font:600 10.5px/1 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pill{font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
#elevWrap{touch-action:pan-y;min-width:0}
#elevWrap svg,#planWrap svg{display:block;margin:0 auto;max-width:100%}
.hintline{font-size:12px;color:var(--muted);margin:4px 2px 0}

/* svg drawing classes */
.wallbg{fill:var(--wall)}
.wline{stroke:var(--ink);fill:none}
.ceil{stroke:var(--muted);fill:none}
.hatchbg{fill:url(#hatch)}
.hatchln{stroke:var(--hatch)}
.cornerlbl{fill:var(--muted);font-family:var(--font-mono);letter-spacing:.06em}
.dim line{stroke:var(--dim);stroke-width:var(--dw)}
.dim .ext{stroke:var(--dim);stroke-opacity:.45}
.dim text{fill:var(--dim);font-family:var(--font-mono);font-weight:500}
.dim.gap line{stroke-dasharray:calc(var(--dw)*4) calc(var(--dw)*3);stroke-opacity:.6}
.dim.gap text{fill:var(--muted)}
.tagbg{fill:var(--panel);stroke:var(--line)}
.tagtx{fill:var(--ink);font-family:var(--font-mono);font-weight:500}
.it{cursor:grab}
.it:active{cursor:grabbing}
.selbox{fill:none;stroke:var(--accent);stroke-width:var(--sw)}
.badbox{fill:var(--warn);fill-opacity:.12;stroke:var(--warn);stroke-width:var(--sw);stroke-dasharray:calc(var(--sw)*3) calc(var(--sw)*2)}
.pv-ok{fill:var(--accent);fill-opacity:.18;stroke:var(--accent);stroke-width:var(--sw)}
.pv-bad{fill:var(--warn);fill-opacity:.16;stroke:var(--warn);stroke-width:var(--sw)}
.r-glass{fill:var(--glass);stroke:var(--ink)}
.r-frame{fill:none;stroke:var(--ink)}
.r-sill{fill:var(--panel);stroke:var(--ink)}
.r-door{fill:var(--paper);stroke:var(--ink)}
.r-sign{fill:none;stroke:var(--ink);stroke-opacity:.45}
.emptytx{fill:var(--muted);font-family:var(--font-ui)}
.plan-wall{fill:var(--ink);cursor:pointer}
.plan-wall.on{fill:var(--accent)}
.plan-room{fill:none;stroke:var(--muted);stroke-dasharray:var(--dash)}
.plan-floor{fill:var(--wall)}
.plan-lbl{fill:var(--muted);font-family:var(--font-mono);font-weight:500}
.plan-lbl.on{fill:var(--accent)}
.plan-tag{fill:var(--ink);font-family:var(--font-mono);font-weight:500}
.plan-up{fill:none;stroke:var(--ink);stroke-dasharray:var(--dash);stroke-opacity:.7}
.plan-ln{stroke:var(--ink);fill:none}
.plan-open{fill:var(--paper)}
.pf{cursor:pointer;touch-action:none}
.hdl{touch-action:none}
.ech{cursor:text}
.ech rect{fill:var(--accent)}
.ech text{fill:var(--accent-ink);font-family:var(--font-mono);font-weight:500}
.ech.gp rect{fill:var(--panel);stroke:var(--accent);stroke-width:var(--sw)}
.ech.gp text{fill:var(--accent)}
.ech:hover rect{fill:var(--ink);stroke:var(--ink)}
.ech:hover text{fill:var(--bg)}
.gapln{stroke:var(--accent);stroke-width:var(--sw);stroke-dasharray:calc(var(--sw)*3) calc(var(--sw)*2)}
.edin{position:absolute;transform:translate(-50%,-50%);width:104px;z-index:70;border:2px solid var(--accent);border-radius:7px;background:var(--panel);color:var(--ink);padding:6px 8px;font:500 16px var(--font-mono);text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.hx{cursor:ew-resize}.hy{cursor:ns-resize}
.grip{fill:var(--accent);stroke:var(--paper);stroke-width:var(--sw)}
.grip.wl{fill:var(--ink);fill-opacity:.55}
.hdl:hover .grip{fill:var(--ink);fill-opacity:1}
.tip{position:fixed;left:0;top:0;pointer-events:none;z-index:55;background:var(--accent);color:var(--accent-ink);font:500 12px var(--font-mono);padding:4px 8px;border-radius:6px;transform:translate(14px,-120%);white-space:pre;line-height:1.45}
.tip.bad{background:var(--warn);color:var(--panel)}
#view3d{position:relative;touch-action:none;border-radius:8px;overflow:hidden;min-height:300px;background:var(--paper)}
#view3d canvas{display:block;width:100%;cursor:grab}
#view3d canvas:active{cursor:grabbing}
.v3bar{position:absolute;right:10px;top:10px;display:flex;gap:6px}
.v3msg{position:absolute;inset:0;display:grid;place-items:center;margin:0;color:var(--muted);font-size:13px;text-align:center;padding-inline:16px}

/* inspector */
.insp{display:flex;flex-direction:column;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:hidden}
.itabs{display:flex;border-bottom:1px solid var(--line)}
.itabs button{flex:1;border:0;background:transparent;padding:11px 6px 10px;font-size:12.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.itabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.ibody{padding:14px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>label,.fld>.lbl{font:600 10.5px/1 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.num{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.num input{width:78px;border:0;background:transparent;padding:7px 8px;font:500 14px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.num span{padding:7px 8px 7px 0;font:12px var(--font-mono);color:var(--muted);align-self:center}
.num button{border:0;background:transparent;padding:0 10px;font-weight:600;color:var(--muted)}
.num button:hover{color:var(--accent);background:var(--accent-soft)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 9px;font:500 12px var(--font-mono);font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.txt{font-family:var(--font-ui)}
.ihead{display:flex;gap:10px;align-items:flex-start}
.ihead .ic{width:56px;height:60px;flex:none;border:1px solid var(--line);border-radius:8px;background:var(--paper);display:grid;place-items:center;padding:4px}
.ihead .ic svg{width:100%;height:100%}
.ihead h2{margin:0;font:700 16px/1.2 var(--font-ui);text-wrap:balance}
.ihead .tg{font:500 12px var(--font-mono);color:var(--muted)}
.segs{display:flex;flex-direction:column;gap:6px}
.segrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.segrow .top{display:flex;gap:6px;align-items:center;flex-wrap:wrap;grid-column:1/-1}
.segrow .top.hd{flex-wrap:nowrap}
.segrow .top.hd select{flex:1}
.segrow select{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:5px 6px;font-size:13px;min-width:0}
.segrow .mm{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.segrow .mm input{width:58px;border:0;background:transparent;padding:5px 4px 5px 6px;font:500 13px var(--font-mono);text-align:right}
.segrow .mm span{font:11px var(--font-mono);color:var(--muted);padding-right:6px}
.mini{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 7px;font-size:12px;font-weight:600;line-height:1.2}
.mini:hover{border-color:var(--accent)}
.mini[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mini.x{color:var(--warn)}
.segnum{font:500 11px var(--font-mono);color:var(--muted);width:16px}
.empty{color:var(--muted);font-size:13px;line-height:1.5;padding:6px 0}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.swatch{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:transparent;padding:0;width:58px}
.swatch i{display:block;width:44px;height:44px;border-radius:8px;border:1px solid var(--line);box-shadow:inset 0 0 0 3px var(--panel)}
.swatch span{font-size:10.5px;line-height:1.15;text-align:center;color:var(--muted)}
.swatch[aria-pressed="true"] i{outline:2px solid var(--accent);outline-offset:2px}
.swatch[aria-pressed="true"] span{color:var(--ink);font-weight:600}
.lay{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lay button{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600}
.lay button svg{width:44px;height:30px}
.lay button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.lay button path{stroke:currentColor}
hr.sep{border:0;border-top:1px solid var(--line);margin:0}

/* list */
.spec{display:flex;flex-direction:column;gap:2px}
.spec h4{margin:8px 0 4px;font:600 10.5px/1 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sline{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:8px;padding:6px 6px;border-radius:6px;align-items:baseline;border:0;background:transparent;text-align:left;width:100%}
.sline:hover{background:var(--accent-soft)}
.sline .t{font:500 12px var(--font-mono);color:var(--accent)}
.sline .n{font-size:13px;font-weight:600;min-width:0}
.sline .n small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.sline .w{font:500 12.5px var(--font-mono);font-variant-numeric:tabular-nums}
.sline.bad .w{color:var(--warn)}
.totals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tot{border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--paper)}
.tot b{display:block;font:600 17px/1.1 var(--font-mono);font-variant-numeric:tabular-nums}
.tot span{font-size:11px;color:var(--muted)}
.form{display:flex;flex-direction:column;gap:8px}
.form input,.form textarea{border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:8px 10px;width:100%;font-size:14px}
.form textarea{min-height:70px;resize:vertical}
.reqtext{width:100%;min-height:120px;font:12px/1.5 var(--font-mono);border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:8px;white-space:pre}
.note{font-size:12.5px;color:var(--muted);margin:0}

/* ghost + toast */
.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:50;background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;padding:5px 9px;border-radius:6px;transform:translate(-50%,-140%);white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;z-index:60;max-width:min(92vw,460px);box-shadow:0 6px 24px rgba(0,0,0,.18)}

@media (max-width:1180px){
  .work{grid-template-columns:196px minmax(0,1fr)}
  .insp{grid-column:1/-1;position:static;max-height:none}
}
@media (max-width:760px){
  .work{grid-template-columns:minmax(0,1fr)}
  .cat{position:static;padding:10px;gap:8px}
  .cat .cats{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}
  .cgroup{flex:none}
  .cgrid{display:flex;gap:6px}
  .citem{width:84px}
  .brand h1{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><small data-i="brand"></small><h1 data-i="title"></h1></div>
    <div class="grow"></div>
    <div class="tools">
      <button class="btn" id="undo" data-i-title="undo"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 3 2 6l3 3"/><path d="M2.5 6H10a4 4 0 0 1 0 8H7"/></svg><span data-i="undo"></span></button>
      <button class="btn" id="redo" data-i-title="redo"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m11 3 3 3-3 3"/><path d="M13.5 6H6a4 4 0 0 0 0 8h3"/></svg><span data-i="redo"></span></button>
      <div class="seg" role="group" aria-label="Language">
        <button id="lgLT" data-lang="lt">LT</button><button id="lgEN" data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <main class="work">
    <aside class="panel cat" id="cat"></aside>

    <section class="board">
      <div class="sheet">
        <div class="sheet-head">
          <div class="seg" id="viewSw" role="group" aria-label="View"><button type="button" data-view="wall" data-i="vWall"></button><button type="button" data-view="3d">3D</button></div>
          <div class="wtabs" id="wtabs"></div>
          <div class="grow"></div>
          <span class="pill" id="exPill" hidden></span>
        </div>
        <div id="elevWrap"></div>
        <div id="view3d" hidden><div class="v3bar"><button type="button" class="btn" id="v3reset" data-i="v3reset"></button></div><p class="v3msg" id="v3msg" hidden></p></div>
        <p class="hintline" id="elevHint"></p>
      </div>
      <div class="sheet">
        <div class="sheet-head"><span class="sheet-label" data-i="plan"></span></div>
        <div id="planWrap"></div>
      </div>
    </section>

    <aside class="panel insp">
      <div class="itabs" role="tablist">
        <button role="tab" id="tabCab" data-tab="cab" data-i="tabCab"></button>
        <button role="tab" id="tabRoom" data-tab="room" data-i="tabRoom"></button>
        <button role="tab" id="tabList" data-tab="list" data-i="tabList"></button>
      </div>
      <div class="ibody" id="insp"></div>
    </aside>
  </main>
</div>
<div class="toast" id="toast" hidden></div>
<div class="tip" id="tip" hidden></div>

<script>
'use strict';
/* ---------------- text ---------------- */
const T={
lt:{brand:'Dėdės Baldai',title:'Virtuvės eskizas',undo:'Atšaukti',redo:'Grąžinti',
 catBase:'Apatinės spintelės',catWall:'Pakabinamos',catTall:'Aukštos spintos',catRoom:'Patalpa',
 dragHint:'Tempkite į brėžinį arba bakstelėkite, kad pridėtumėte.',
 elev:'Sienos vaizdas',plan:'Planas iš viršaus',wall:'Siena',
 tabCab:'Spintelė',tabRoom:'Patalpa ir apdaila',tabList:'Sąrašas',

const DEPTH={base:600,tall:600,wall:350,window:0,door:0};
const OCC={base:['F'],wall:['U'],tall:['F','U'],window:['U'],door:['F','U']};
const WALLS_FOR={I:['A'],L:['A','B'],U:['A','B','C']};
const LORD={tall:0,base:1,wall:2,door:3,window:4};
const SNAP=70;

/* ---------------- state ---------------- */
const KEY='db-kitchen-sketch-v1';
const uid=()=>Math.random().toString(36).slice(2,9);
const clone=o=>JSON.parse(JSON.stringify(o));
function mk(t,wall,x,extra){
  const c=CAT[t]; const it={id:uid(),t,layer:c.layer,wall,x,w:c.w};
  if(c.segs) it.segs=clone(c.segs);
  if(c.h) it.h=c.h; if(c.y0!=null) it.y0=c.y0; if(c.hg) it.hg=c.hg;
  return Object.assign(it,extra||{});
}
function sample(){
  return [
    mk('tall_fridge','A',0), mk('base_drawers','A',600), mk('base_oven','A',1200),
    mk('base_door','A',1800,{segs:[{k:'drawer',r:1},{k:'door',n:1,hg:'R',r:4}]}),
    mk('base_dw','A',2400), mk('base_sink','A',3000,{w:600}),
    mk('wall_door','A',600), mk('wall_hood','A',1200), mk('wall_door','A',1800,{segs:[{k:'door',n:1,hg:'R',r:1}]}),
    mk('wall_lift','A',2400,{w:800}), mk('wall_door','A',3200,{w:400}),
    mk('base_door','B',600,{segs:[{k:'drawer',r:1},{k:'door',n:1,hg:'L',r:4}]}),
    mk('base_drawers','B',1200,{segs:[{k:'drawer',r:1},{k:'drawer',r:1}]}),
    mk('base_door','B',1800,{segs:[{k:'door',n:2,r:1}]}),
    mk('window','B',900), mk('wall_open','B',350,{w:500}), mk('wall_door','B',2100,{w:300,segs:[{k:'door',n:1,hg:'R',r:1}]})
  ];
}
function defaultState(){
  return {v:1,example:true,layout:'L',walls:{A:3600,B:2400,C:3000},roomH:2600,
    dims:{plinth:100,baseH:720,top:38,wallBottom:1420,wallH:720},
    finish:'white',worktop:'oak',handle:'bar',contact:{name:'',phone:'',email:'',note:''},items:sample()};
}
let S=defaultState();
const U={wall:'A',sel:null,tab:'room',lang:'lt',undo:[],redo:[],view:'wall'};
try{const raw=localStorage.getItem(KEY); if(raw){const o=JSON.parse(raw); if(o&&o.s&&o.s.items){S=Object.assign(defaultState(),o.s); U.lang=o.lang||'lt';}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({s:S,lang:U.lang}))}catch(e){}}

const $=s=>document.querySelector(s);
const t=k=>(T[U.lang]&&T[U.lang][k])||T.lt[k]||k;
const nm=o=>o[U.lang]||o.lt;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byId=id=>S.items.find(i=>i.id===id);
const activeWalls=()=>WALLS_FOR[S.layout];
const r1=n=>Math.round(n*10)/10;

function snapshot(){U.undo.push(JSON.stringify(S)); if(U.undo.length>80)U.undo.shift(); U.redo=[];}
function mut(fn){snapshot(); fn(); S.example=false; render();}
function undo(){if(!U.undo.length)return; U.redo.push(JSON.stringify(S)); S=JSON.parse(U.undo.pop()); fixSel(); render();}
function redo(){if(!U.redo.length)return; U.undo.push(JSON.stringify(S)); S=JSON.parse(U.redo.pop()); fixSel(); render();}
function fixSel(){if(U.sel&&!byId(U.sel))U.sel=null; if(!activeWalls().includes(U.wall))U.wall='A';}

/* ---------------- geometry ---------------- */
function wallTop(){return S.dims.wallBottom+S.dims.wallH}
function vert(it){
  const d=S.dims;
  switch(it.layer){
    case 'base':return [d.plinth,d.plinth+d.baseH];
    case 'wall':{const tp=wallTop(); return [tp-(it.h||d.wallH),tp];}
    case 'tall':return [d.plinth,wallTop()];
    case 'window':return [it.y0,it.y0+it.h];
    case 'door':return [0,it.h];
  }
  return [0,0];
}
function corners(wallId){
  const ws=activeWalls(), i=ws.indexOf(wallId), res=[]; if(i<0)return res;
  const L=S.walls[wallId];
  for(const occ of ['F','U']){
    const sq=occ==='F'?600:350;
    if(i>0){const p=ws[i-1],Lp=S.walls[p]; let dep=0;
      for(const it of S.items) if(it.wall===p&&OCC[it.layer].includes(occ)&&DEPTH[it.layer]>0&&it.x+it.w>Lp-sq+1) dep=Math.max(dep,DEPTH[it.layer]);
      if(dep)res.push({occ,a:0,b:dep,tall:S.items.some(it=>it.wall===p&&it.layer==='tall'&&it.x+it.w>Lp-sq+1)});}
    if(i<ws.length-1){const n=ws[i+1]; let dep=0;
      for(const it of S.items) if(it.wall===n&&OCC[it.layer].includes(occ)&&DEPTH[it.layer]>0&&it.x<sq-1) dep=Math.max(dep,DEPTH[it.layer]);
      if(dep)res.push({occ,a:L-dep,b:L,tall:S.items.some(it=>it.wall===n&&it.layer==='tall'&&it.x<sq-1)});}
  }
  return res;
}
function intervals(wallId,occ,exId){
  const out=[];
  for(const it of S.items){ if(it.wall!==wallId||it.id===exId)continue; if(OCC[it.layer].includes(occ))out.push([it.x,it.x+it.w]); }
  for(const c of corners(wallId)) if(c.occ===occ) out.push([c.a,c.b]);
  return out;
}
function findSpot(it,desired,wallId){
  wallId=wallId||it.wall; const L=S.walls[wallId], w=it.w;
  let iv=[]; for(const o of OCC[it.layer]) iv=iv.concat(intervals(wallId,o,it.id));
  iv=iv.map(([a,b])=>[Math.max(0,a),Math.min(L,b)]).filter(([a,b])=>b>a).sort((p,q)=>p[0]-q[0]);
  const m=[]; for(const s of iv){ if(m.length&&s[0]<=m[m.length-1][1]+0.5) m[m.length-1][1]=Math.max(m[m.length-1][1],s[1]); else m.push([s[0],s[1]]); }
  const gaps=[]; let cur=0; for(const [a,b] of m){ if(a-cur>=w-0.5)gaps.push([cur,a]); cur=Math.max(cur,b);} if(L-cur>=w-0.5)gaps.push([cur,L]);
  let best=null,bd=Infinity;
  for(const [a,b] of gaps){const x=Math.min(Math.max(desired,a),b-w); const d=Math.abs(x-desired); if(d<bd){bd=d;best=x;}}
  return best==null?null:Math.round(best);
}
function snapX(it,x,wallId,tol){
  const L=S.walls[wallId], w=it.w, c=[[0,'wall'],[L-w,'wall']];
  for(const o of S.items){ if(o.wall!==wallId||o.id===it.id)continue; c.push([o.x,'nb'],[o.x+o.w,'nb'],[o.x-w,'nb'],[o.x+o.w-w,'nb']); }
  for(const k of corners(wallId)) c.push([k.b,'corner'],[k.a-w,'corner']);
  let best=null,bd=tol==null?SNAP:tol; for(const [v,why] of c){const d=Math.abs(v-x); if(d<bd){bd=d;best={x:v,why};}}
  return best||{x:Math.round(x/10)*10,why:''};
}
function clampX(it,x){const L=S.walls[it.wall]; return Math.round(Math.max(0,Math.min(Math.max(0,L-it.w),x)));}
function freeGaps(it,wallId){
  const L=S.walls[wallId]; let iv=[]; for(const o of OCC[it.layer]) iv=iv.concat(intervals(wallId,o,it.id));
  iv=iv.map(([a,b])=>[Math.max(0,a),Math.min(L,b)]).filter(([a,b])=>b>a).sort((p,q)=>p[0]-q[0]);
  const g=[]; let cur=0; for(const [a,b] of iv){ if(a>cur+0.5)g.push([cur,a]); cur=Math.max(cur,b);} if(L>cur+0.5)g.push([cur,L]);
  return g;
}
function dragInfo(it,why){
  const bad=isBad(it), tg=tags()[it.id], name=(tg?tg+' ':'')+nm(CAT[it.t]);
  let l2=t('fromStart').replace('{x}',Math.round(it.x));
  if(!bad){const {lref,rref}=gapRefs(it); l2+=' · '+t('leftRight').replace('{l}',Math.round(it.x-lref)).replace('{r}',Math.round(rref-it.x-it.w));}
  if(why) l2+=' · '+t('snap_'+why);
  const lines=[`${name} → ${t('wall')} ${it.wall}`,l2]; if(bad) lines.push(t('hit'));
  return {lines,bad};
}
function tipL(e,info){const el=$('#tip'); if(!info){el.hidden=true; return;} el.textContent=info.lines.join('\n'); el.classList.toggle('bad',!!info.bad); el.style.left=e.clientX+'px'; el.style.top=e.clientY+'px'; el.hidden=false;}
function isBad(it){
  const L=S.walls[it.wall]; if(it.x<-0.5||it.x+it.w>L+0.5)return true;
  for(const o of OCC[it.layer]) for(const [a,b] of intervals(it.wall,o,it.id)) if(it.x<b-0.5&&it.x+it.w>a+0.5)return true;
  return false;
}
function tags(){
  const m={};
  for(const w of activeWalls()){
    S.items.filter(i=>i.wall===w&&i.segs).sort((a,b)=>a.x-b.x||LORD[a.layer]-LORD[b.layer]).forEach((it,i)=>m[it.id]=w+(i+1));
  }
  return m;
}
function segAvail(it){const [y0,y1]=vert(it); const n=(it.segs||[]).length; return (y1-y0)-4-4*Math.max(0,n-1);}
function segMM(it){const A=segAvail(it), R=it.segs.reduce((a,b)=>a+b.r,0)||1; return it.segs.map(s=>A*s.r/R);}

/* ---------------- drawing ---------------- */
const EDGE='rgba(14,18,16,.55)';
function segSVG(sg,x,y,w,h,cf,fin){
  const hc=fin.h, top=cf<1300;
  const panel=(px,pw)=>`<rect x="${r1(px)}" y="${r1(y)}" width="${r1(pw)}" height="${r1(h)}" fill="${fin.c}" stroke="${EDGE}" stroke-width="2.5"/>`;
  const sign=pts=>`<polyline points="${pts}" fill="none" stroke="${hc}" stroke-opacity=".42" stroke-width="3.5" stroke-dasharray="34 20"/>`;
  const vH=hx=>{ if(S.handle==='gola')return ''; const L=Math.min(150,h*0.35);
    if(S.handle==='knob') return `<circle cx="${r1(hx)}" cy="${r1(top?y+60:y+h-60)}" r="15" fill="${hc}"/>`;
    return `<rect x="${r1(hx-7)}" y="${r1(top?y+45:y+h-45-L)}" width="14" height="${r1(L)}" rx="7" fill="${hc}"/>`; };
  const hH=(cx,hy)=>{ if(S.handle==='gola')return ''; if(S.handle==='knob') return `<circle cx="${r1(cx)}" cy="${r1(hy)}" r="15" fill="${hc}"/>`;
    const L=Math.min(220,w*0.45); return `<rect x="${r1(cx-L/2)}" y="${r1(hy-7)}" width="${r1(L)}" height="14" rx="7" fill="${hc}"/>`; };
  const gola=()=>S.handle==='gola'?`<rect x="${r1(x)}" y="${r1(y)}" width="${r1(w)}" height="16" fill="${EDGE}" opacity=".5"/>`:'';
  const P=(...a)=>a.map(r1).join(',');
  switch(sg.k){
    case 'drawer': return panel(x,w)+gola()+hH(x+w/2,y+Math.min(50,h*0.3));
    case 'door':{
      if(sg.n===2){const hw=(w-4)/2, a=x, b=x+hw+4;
        return panel(a,hw)+panel(b,hw)+gola()+sign(`${P(a,y)} ${P(a+hw,y+h/2)} ${P(a,y+h)}`)+sign(`${P(b+hw,y)} ${P(b,y+h/2)} ${P(b+hw,y+h)}`)+vH(a+hw-40)+vH(b+40);}
      const L=(sg.hg||'L')==='L';
      const pts=L?`${P(x,y)} ${P(x+w,y+h/2)} ${P(x,y+h)}`:`${P(x+w,y)} ${P(x,y+h/2)} ${P(x+w,y+h)}`;
      return panel(x,w)+gola()+sign(pts)+vH(L?x+w-40:x+40);
    }

function handlesSVG(it){

  const vg=(x,h)=>`<g class="hdl hx" data-h="${h}"><rect x="${r1(x-hit/2)}" y="${r1(Y)}" width="${r1(hit)}" height="${r1(Hh)}" fill="transparent"/><rect class="grip" x="${r1(x-gw/2)}" y="${r1(Y+Hh/2-glv/2)}" width="${r1(gw)}" height="${r1(glv)}" rx="${r1(gw/2)}"/></g>`;
  const hg=(y,h,i)=>`<g class="hdl hy" data-h="${h}"${i!=null?` data-i="${i}"`:''}><rect x="${r1(X+hit*0.6)}" y="${r1(y-hit/2)}" width="${r1(Math.max(1,W-hit*1.2))}" height="${r1(hit)}" fill="transparent"/><rect class="grip" x="${r1(X+W/2-glh/2)}" y="${r1(y-gw/2)}" width="${r1(glh)}" height="${r1(gw)}" rx="${r1(gw/2)}"/></g>`;

  if(it.layer==='window'){s+=hg(Y,'top'); s+=hg(Y+Hh,'bot');}
  if(it.layer==='door') s+=hg(Y,'top');

}
function renderPlan(){
  const ws=activeWalls(), A=S.walls.A, B=S.walls.B, C=S.walls.C, Tw=110, tg=tags(), fin=FINISH[S.finish], tp=TOPS[S.worktop];
  const has=w=>ws.includes(w);
  const P=(wall,u,v)=>wall==='A'?[u,v]:wall==='B'?[A-v,u]:[A-u,B-v];
  const poly=(wall,u0,u1,v0,v1)=>[P(wall,u0,v0),P(wall,u1,v0),P(wall,u1,v1),P(wall,u0,v1)].map(p=>p.map(r1).join(',')).join(' ');
  const minX=Math.min(0,has('C')?A-C:0)-450, maxX=A+(has('B')?520:450), minY=-520, maxY=(has('B')?B:2200)+(has('C')?450:250);
  const vbW=maxX-minX, vbH=maxY-minY;
  const wrap=$('#planWrap'), cw=Math.max(260,wrap.clientWidth);
  const k=Math.max(vbW/cw,vbH/330), fs=11*k; PK=k;
  let s=`<svg id="plan" viewBox="${r1(minX)} ${r1(minY)} ${r1(vbW)} ${r1(vbH)}" width="${r1(vbW/k)}" height="${r1(vbH/k)}" style="--dash:${r1(5*k)} ${r1(3.5*k)};--sw:${r1(2*k)}" role="img" aria-label="${esc(t('plan'))}">`;
  // floor
  let floor;
  if(S.layout==='I') floor=`0,0 ${A},0 ${A},2200 0,2200`;
  else if(S.layout==='L') floor=`0,0 ${A},0 ${A},${B} 0,${B}`;
  else floor=`0,0 ${A},0 ${A},${B} ${A-C},${B} ${Math.min(0,A-C)},${B} ${Math.min(0,A-C)},0`;
  s+=`<polygon class="plan-floor" points="${floor}"/><polygon class="plan-room" points="${floor}" stroke-width="${r1(1*k)}"/>`;
  // walls
  const wr={A:[0,-Tw,A+(has('B')?Tw:0),Tw],B:[A,-Tw,Tw,B+Tw+(has('C')?Tw:0)],C:[A-C,B,C+Tw,Tw]};
  for(const w of ws){const [x,y,ww,hh]=wr[w]; s+=`<rect class="plan-wall${U.wall===w?' on':''}" data-wall="${w}" x="${x}" y="${y}" width="${ww}" height="${hh}"/>`;}
  // labels
  const lp={A:[A/2,-Tw-fs*0.9,0],B:[A+Tw+fs*1.1,B/2,90],C:[A-C/2,B+Tw+fs*1.8,0]};
  for(const w of ws){const [x,y,r]=lp[w]; s+=`<text class="plan-lbl${U.wall===w?' on':''}" data-wall="${w}" x="${r1(x)}" y="${r1(y)}" font-size="${r1(fs)}" text-anchor="middle" ${r?`transform="rotate(90 ${r1(x)} ${r1(y)})"`:''} style="cursor:pointer">${w} · ${S.walls[w]}</text>`;}
  const items=S.items.filter(i=>has(i.wall)).sort((a,b)=>LORD[a.layer]-LORD[b.layer]);
  let up='', sel='', lbl='';
  for(const it of items){
    const w=it.wall, u0=it.x, u1=it.x+it.w;
    if(it.layer==='base'){
      s+=`<polygon class="pf" data-id="${it.id}" points="${poly(w,u0,u1,0,600)}" fill="${tp.c}" stroke="${EDGE}" stroke-width="${r1(1.2*k)}"/>`;
      const c=CAT[it.t];
      if(c.sink) s+=`<polygon points="${poly(w,u0+70,u1-70,90,500)}" fill="none" stroke="${EDGE}" stroke-width="${r1(1.2*k)}" pointer-events="none"/>`;
      if(c.hob){const cu=(u0+u1)/2; for(const [du,dv] of [[-140,170],[140,170],[-140,420],[140,420]]){const [px,py]=P(w,cu+du,dv); s+=`<circle cx="${r1(px)}" cy="${r1(py)}" r="70" fill="none" stroke="#151617" stroke-width="${r1(1.3*k)}" pointer-events="none"/>`;}}
    } else if(it.layer==='tall'){
      const p=[P(w,u0,0),P(w,u1,600)], q=[P(w,u1,0),P(w,u0,600)];
      s+=`<polygon class="pf" data-id="${it.id}" points="${poly(w,u0,u1,0,600)}" fill="${fin.c}" stroke="${EDGE}" stroke-width="${r1(1.2*k)}"/><line x1="${r1(p[0][0])}" y1="${r1(p[0][1])}" x2="${r1(p[1][0])}" y2="${r1(p[1][1])}" stroke="${EDGE}" stroke-width="${r1(1*k)}" pointer-events="none"/><line x1="${r1(q[0][0])}" y1="${r1(q[0][1])}" x2="${r1(q[1][0])}" y2="${r1(q[1][1])}" stroke="${EDGE}" stroke-width="${r1(1*k)}" pointer-events="none"/>`;
    } else if(it.layer==='wall'){
      up+=`<polygon class="plan-up pf" data-id="${it.id}" points="${poly(w,u0,u1,0,350)}" stroke-width="${r1(1.2*k)}" fill="transparent"/>`;
    } else if(it.layer==='window'){
      s+=`<polygon class="r-glass pf" data-id="${it.id}" points="${poly(w,u0,u1,-Tw,0)}" stroke-width="${r1(1*k)}"/>`;
    } else if(it.layer==='door'){

        `<line class="plan-ln" x1="${r1(h0[0])}" y1="${r1(h0[1])}" x2="${r1(h1[0])}" y2="${r1(h1[1])}" stroke-width="${r1(2*k)}" pointer-events="none"/>`+
        `<path class="plan-ln" d="M${r1(h1[0])},${r1(h1[1])} A${wd},${wd} 0 0 ${sweep} ${r1(o[0])},${r1(o[1])}" stroke-width="${r1(0.9*k)}" stroke-dasharray="${r1(4*k)} ${r1(3*k)}" pointer-events="none"/>`;
    }
    if(tg[it.id]){const v=it.layer==='wall'?175:it.layer==='tall'?300:430; const [px,py]=P(w,(u0+u1)/2,v); const f=Math.min(fs*0.95,it.w/(tg[it.id].length*0.7)); lbl+=`<text class="plan-tag" x="${r1(px)}" y="${r1(py+f*0.35)}" font-size="${r1(f)}" text-anchor="middle" pointer-events="none" ${it.layer==='wall'?'fill-opacity=".7"':''}>${tg[it.id]}</text>`;}
    if(it.id===U.sel){const vv=DEPTH[it.layer]||0; sel=`<polygon class="selbox" points="${poly(w,u0,u1,vv?0:-Tw,vv||0)}" pointer-events="none"/>`;}
  }
  s+=up+lbl+sel+'</svg>';
  wrap.innerHTML=s;
}

function fdesc(it){
  if(!it.segs) return '';
  const cnt={}; let hg='';
  for(const s of it.segs){const k=s.k; const n=k==='door'?(s.n||1):1; cnt[k]=(cnt[k]||0)+n; if(k==='door'&&s.n!==2&&!hg) hg=s.hg||'L';}
  const parts=Object.entries(cnt).map(([k,n])=>`${t('k_'+k)} ×${n}`);
  const c=CAT[it.t]; const ex=[]; if(c.sink)ex.push(t('sink')); if(c.hob)ex.push(t('hob')); if(c.hood)ex.push(t('hood')); if(c.fridge)ex.push(t('fridge'));
  return parts.join(' · ')+(ex.length?' · '+ex.join(', '):'');
}
function hOf(it){const [a,b]=vert(it); return b-a;}
function listed(){
  const tg=tags(); const out=[];

  return {out,tg};
}
function totals(){
  const {out}=listed(); let base=0,dr=0,dd=0;

  return {n:out.length,base,dr,dd};
}

  lines.push(`${t('frontColor')}: ${nm(FINISH[S.finish])} · ${t('worktop')}: ${nm(TOPS[S.worktop])} · ${t('handles')}: ${t('h_'+S.handle)}`);
  lines.push('');

  const rooms=S.items.filter(i=>activeWalls().includes(i.wall)&&!i.segs);

}

function pdUp(e){

function setW(it,v){
  v=Math.round(v); const lim=it.layer==='window'?[300,4000]:it.layer==='door'?[600,1400]:[150,1500];
  v=Math.max(lim[0],Math.min(lim[1],v)); if(v===it.w)return;
  const old=it.w, ox=it.x; snapshot(); it.w=v; const sp=findSpot(it,it.x,it.wall);
  if(sp==null){it.w=old; it.x=ox; U.undo.pop(); toast(t('noSpace')); renderInspector(); return;}
  it.x=sp; S.example=false; render();
}
function setSegMM(it,i,v){
  const A=segAvail(it), n=it.segs.length; if(n<2)return;
  const minH=60; v=Math.max(minH,Math.min(A-minH*(n-1),v));
  const others=it.segs.reduce((a,s,j)=>j===i?a:a+s.r,0);
  mut(()=>{it.segs[i].r=v/(A-v)*others;});
}
const insp=$('#insp');
insp.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.tagName==='INPUT'||b.tagName==='SELECT')return;
  const act=b.dataset.act, it=U.sel&&byId(U.sel), i=+b.dataset.i, v=b.dataset.v, d=+b.dataset.d;
  if(b.dataset.d!=null){ // +/- steppers
    const inp=document.getElementById('in-'+act); if(inp){inp.value=(+inp.value||0)+d; inp.dispatchEvent(new Event('change',{bubbles:true}));}
    return;
  }
  switch(act){
    case 'wpre': if(it)setW(it,+v); break;
    case 'hpre': if(it)mut(()=>{it.h=+v;}); break;
    case 'preset': if(it)mut(()=>{it.segs=clone(presetsFor(it)[i].s);}); break;
    case 'sup': if(it&&i>0)mut(()=>{const s=it.segs; [s[i-1],s[i]]=[s[i],s[i-1]];}); break;
    case 'sdn': if(it&&i<it.segs.length-1)mut(()=>{const s=it.segs; [s[i+1],s[i]]=[s[i],s[i+1]];}); break;
    case 'sdel': if(it&&it.segs.length>1)mut(()=>{it.segs.splice(i,1);}); break;
    case 'sn': if(it)mut(()=>{it.segs[i].n=+v; if(+v===1&&!it.segs[i].hg)it.segs[i].hg='L';}); break;
    case 'shg': if(it)mut(()=>{it.segs[i].hg=v;}); break;
    case 'addDrawer': if(it)mut(()=>{const avg=it.segs.reduce((a,s)=>a+s.r,0)/it.segs.length; it.segs.unshift({k:'drawer',r:Math.max(0.6,avg*0.6)});}); break;
    case 'addDoor': if(it)mut(()=>{const avg=it.segs.reduce((a,s)=>a+s.r,0)/it.segs.length; it.segs.push({k:'door',n:1,hg:'L',r:avg});}); break;
    case 'mirror': if(it)mut(()=>{ if(it.layer==='door')it.hg=it.hg==='R'?'L':'R'; else it.segs.forEach(s=>{if(s.k==='door'&&s.n!==2)s.hg=s.hg==='R'?'L':'R';}); }); break;
    case 'dup': if(it){const c=clone(it); c.id=uid(); const sp=findSpot(c,it.x+it.w,it.wall); if(sp==null){toast(t('noSpace'));break;} mut(()=>{c.x=sp; S.items.push(c); U.sel=c.id;});} break;
    case 'del': if(it)mut(()=>{S.items=S.items.filter(o=>o.id!==it.id); U.sel=null;}); break;
    case 'move': if(it&&v!==it.wall){const sp=findSpot(it,appendX(it,v),v); if(sp==null){toast(t('noSpace'));break;} mut(()=>{it.wall=v; it.x=sp; U.wall=v;});} break;
    case 'layout': if(v!==S.layout)mut(()=>{S.layout=v; if(!activeWalls().includes(U.wall))U.wall='A';}); break;
    case 'fin': mut(()=>{S.finish=v;}); break;
    case 'top': mut(()=>{S.worktop=v;}); break;
    case 'hdl': mut(()=>{S.handle=v;}); break;
    case 'example': snapshot(); S=defaultState(); S.contact=JSON.parse(U.undo[U.undo.length-1]).contact||S.contact; U.sel=null; U.wall='A'; render(); break;
    case 'clear':

});

const STDW=[300,400,450,500,600,800,900,1000,1200];
const WSTD=[360,580,720,900];
let RD=null;
function limW(it){return it.layer==='window'?[300,4000]:it.layer==='door'?[600,1400]:[150,1500];}
function neigh(it){let iv=[]; for(const o of OCC[it.layer]) iv=iv.concat(intervals(it.wall,o,it.id)); return iv;}
function edgesOn(it){const c=[]; for(const o of S.items) if(o.wall===it.wall&&o.id!==it.id) c.push(o.x,o.x+o.w); for(const k of corners(it.wall)) c.push(k.a,k.b); return c;}
function nearest(v,c,tol){let b=null,bd=tol; for(const x of c){const d=Math.abs(x-v); if(d<=bd){bd=d;b=x;}} return b;}
function tip(e,txt){const el=$('#tip'); if(!txt){el.hidden=true; return;} el.classList.remove('bad'); el.textContent=txt; el.style.left=e.clientX+'px'; el.style.top=e.clientY+'px'; el.hidden=false;}
function startResize(e,hd){
  const h=hd.dataset.h, it=h==='wall'?null:byId(U.sel);

    const o=G3.orb;
    G3.cam.position.set(o.t.x+o.r*Math.sin(o.ph)*Math.sin(o.th),o.t.y+o.r*Math.cos(o.ph),o.t.z+o.r*Math.sin(o.ph)*Math.cos(o.th));
    G3.cam.lookAt(o.t); R.render(G3.scene,G3.cam);
  });
}
const clampR=r=>Math.max(1.2,Math.min(25,r));
function bindOrbit(el){
  const pts=new Map(); let dn=null, pinch=null;
  el.addEventListener('pointerdown',e=>{
    try{el.setPointerCapture(e.pointerId);}catch(_){}
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1) dn={x:e.clientX,y:e.clientY,pan:e.button===2||e.shiftKey,moved:false};
    if(pts.size===2){const [a,b]=[...pts.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y),r:G3.orb.r}; if(dn)dn.moved=true;}
  });
  el.addEventListener('pointermove',e=>{
    const p=pts.get(e.pointerId); if(!p)return;
    const dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY;
    if(dn&&Math.hypot(e.clientX-dn.x,e.clientY-dn.y)>4) dn.moved=true;
    const o=G3.orb;
    if(pts.size>=2&&pinch){const [a,b]=[...pts.values()]; o.r=clampR(pinch.r*pinch.d/Math.max(1,Math.hypot(a.x-b.x,a.y-b.y)));}
    else if(dn&&dn.pan){const s=o.r*0.0016, right=new THREE.Vector3().setFromMatrixColumn(G3.cam.matrix,0); o.t.addScaledVector(right,-dx*s); o.t.y=Math.max(0,Math.min(3,o.t.y+dy*s));}
    else {o.th-=dx*0.008; o.ph=Math.max(0.2,Math.min(1.52,o.ph-dy*0.006));}
    draw3D();
  });
  const end=e=>{
    if(!pts.has(e.pointerId))return; pts.delete(e.pointerId); if(pts.size<2)pinch=null;
    if(e.type==='pointerup'&&!pts.size&&dn&&!dn.moved) pick3D(e);
    if(!pts.size) dn=null;
  };
  el.addEventListener('pointerup',end); el.addEventListener('pointercancel',end);
  el.addEventListener('wheel',e=>{e.preventDefault(); G3.orb.r=clampR(G3.orb.r*(1+Math.sign(e.deltaY)*Math.min(0.25,Math.abs(e.deltaY)*0.0012))); draw3D();},{passive:false});
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
function pick3D(e){
  const el=G3.R.domElement, r=el.getBoundingClientRect();
  const m=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  const rc=new THREE.Raycaster(); rc.setFromCamera(m,G3.cam);
  for(const h of rc.intersectObjects(G3.root.children,true)){
    let o=h.object; while(o&&!o.userData.id)o=o.parent;
    if(o){const it=byId(o.userData.id); if(it){U.sel=it.id; U.wall=it.wall; if(it.segs)U.tab='cab'; render();} return;}
  }
  if(U.sel){U.sel=null; render();}
}
const FACE={A:0,B:-Math.PI/2,C:Math.PI};
function setView(v){
  U.view=v; $('#elevWrap').hidden=v!=='wall'; $('#view3d').hidden=v!=='3d';
  renderTabs(); if(v==='3d') show3D(); else renderElev();
}
$('#viewSw').addEventListener('click',e=>{const b=e.target.closest('[data-view]'); if(b&&b.dataset.view!==U.view) setView(b.dataset.view);});
$('#v3reset').addEventListener('click',()=>{if(G3){G3.fitKey=''; sched3D();}});
$('#wtabs').addEventListener('click',e=>{const b=e.target.closest('[data-wall]'); if(b&&U.view==='3d'&&G3){G3.orb.th=FACE[b.dataset.wall]; G3.orb.ph=1.2; draw3D();}});
render();
</script>
