@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614; --panel:#1b201d; --sunk:#161a18; --ink:#e4e9e5; --muted:#9aa59f; --line:#2c332f; --line2:#3a433e;
  --accent:#7d9bff; --accent-ink:#0d1330; --accent-soft:#232c4a;
  --bad:#ff8a7e; --bad-bg:#43211e; --ok:#6fd49c; --ok-bg:#163526;
  --paper:#eef0ec; --paper-line:#c9cec8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --panel:#1b201d; --sunk:#161a18; --ink:#e4e9e5; --muted:#9aa59f; --line:#2c332f; --line2:#3a433e;
  --accent:#7d9bff; --accent-ink:#0d1330; --accent-soft:#232c4a;
  --bad:#ff8a7e; --bad-bg:#43211e; --ok:#6fd49c; --ok-bg:#163526;
  --paper:#eef0ec; --paper-line:#c9cec8; color-scheme:dark}

html,body{height:100%}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);margin:0;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1640px;margin:0 auto}
.grow{flex:1}

/* header — as in the Builder */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.dbl{display:block;width:76%;height:76%;background:currentColor;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.brand h1{margin:0;font:600 23px/1 var(--f-display);letter-spacing:.01em;white-space:nowrap}
.brand .sub{font-size:12px;color:var(--muted)}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:7px 12px;font-weight:600;font-size:13.5px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.btn:hover{border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default;border-color:var(--line2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--panel);border-color:var(--bad)}
.btn svg{width:15px;height:15px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden;background:var(--sunk);flex-wrap:nowrap}
.seg button{border:0;background:transparent;padding:7px 12px;font-weight:600;color:var(--muted);border-right:1px solid var(--line);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.lbl,.cat h3,.fld>label,.fld>.lbl{display:block;margin:0 0 4px;font-size:12px;color:var(--muted);font-weight:600}
.note{font-size:12.5px;color:var(--muted);margin:0}
.pill{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}

/* room bar + main grid (rm-bar / rm-main) */
.room{padding-block:14px 24px}
.bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:10px}
.work{display:grid;grid-template-columns:210px minmax(0,1fr) 320px;gap:14px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}

/* palette (rm-pal / rm-chip) */
.cat{padding:12px;display:flex;flex-direction:column;gap:8px;user-select:none;-webkit-user-select:none}
.cat .hint{font-size:12px;color:var(--muted);margin:0}
.cats{display:flex;flex-direction:column;gap:12px}
.cgroup{display:flex;flex-direction:column;gap:6px;min-width:0}
.cgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.citem{display:grid;grid-template-columns:38px minmax(0,1fr);gap:8px;align-items:center;text-align:left;border:1px solid var(--line2);background:var(--panel);border-radius:8px;padding:6px 8px;cursor:grab;touch-action:pan-x;color:var(--ink);min-width:0}
.citem:hover{border-color:var(--accent);box-shadow:0 2px 8px rgba(36,72,201,.12)}
.citem svg{width:38px;height:38px;pointer-events:none;color:var(--ink)}
.citem b{display:block;font-size:13px;line-height:1.2;font-weight:600;pointer-events:none}
.citem small{display:block;font:11px var(--f-mono);color:var(--muted);pointer-events:none}

/* stage (rm-stage) */
.board{display:flex;flex-direction:column;gap:8px;min-width:0}
.stage{position:relative;background:var(--paper);border:1px solid var(--paper-line);border-radius:var(--r);overflow:hidden;min-height:300px;color-scheme:light}
.swrap{overflow:auto;max-height:78vh;min-width:0}
#elevWrap,#planWrap{touch-action:pan-y;user-select:none;-webkit-user-select:none;padding:12px 10px 40px}
#elevWrap svg,#planWrap svg{display:block;margin:0 auto}
.zoom{position:absolute;right:8px;bottom:8px;display:flex;gap:4px;z-index:2}
.zoom button{width:30px;height:30px;padding:0;border:1px solid #c3cac3;border-radius:7px;background:#fff;color:#1b211e;font:600 17px/1 var(--f-body);opacity:.92;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.zoom button:hover{opacity:1;border-color:#2448c9;color:#2448c9}
.stage .pill{position:absolute;left:10px;bottom:10px;z-index:2;background:#e3e9fb;color:#2448c9}
.wtabs{display:inline-flex}
.hintline{font-size:12px;color:var(--muted);margin:0 2px}

/* drawing — fixed light palette, like the Builder's paper */
.wallbg{fill:#f4f2ec;stroke:#d5d1c4}
.wline{stroke:#5f6a64;fill:none}
.ceil{stroke:#9aa39c;fill:none}
.wtitle{font-family:var(--f-mono);font-weight:600;fill:#3f484e}
.hatchbg{fill:url(#hatch)}
.hatchln{stroke:#c9c3b3}
.cornerlbl{fill:#8c948e;font-family:var(--f-mono);letter-spacing:.06em}
.dim line{stroke:#7a847e;stroke-width:var(--dw)}
.dim .ext{stroke:#7a847e;stroke-opacity:.5}
.dim text{fill:#3f484e;font-family:var(--f-mono)}
.dim.gap line{stroke-dasharray:calc(var(--dw)*4) calc(var(--dw)*3);stroke-opacity:.7}
.dim.gap text{fill:#8c948e}
.it{cursor:grab}
.it:active{cursor:grabbing}
.rm-no{fill:#1b211e}
.rm-not{fill:#fff;font-family:var(--f-mono);font-weight:600}
.it.sel .rm-no{fill:#2448c9}
.rm-open{fill:none;stroke:#4f5550;stroke-opacity:.75}
.selbox{fill:none;stroke:#2448c9;stroke-width:var(--sw)}
.badbox{fill:#b4291f;fill-opacity:.12;stroke:#b4291f;stroke-width:var(--sw)}
.pv-ok{fill:rgba(36,72,201,.18);stroke:#2448c9;stroke-width:var(--sw);stroke-dasharray:calc(var(--sw)*3) calc(var(--sw)*2)}
.pv-bad{fill:rgba(180,41,31,.15);stroke:#b4291f;stroke-width:var(--sw);stroke-dasharray:calc(var(--sw)*3) calc(var(--sw)*2)}
.r-glass{fill:#d5e6ee;stroke:#7b8f98}
.r-glare{stroke:#fff;stroke-opacity:.85}
.r-frame{fill:#fbfaf6;stroke:#5f6a64}
.r-jamb{fill:#2d3034}
.r-sill{fill:#fbfaf6;stroke:#5f6a64}
.r-door{fill:#2d3034;stroke:#1b211e}
.r-sign{fill:none;stroke:#4f5550;stroke-opacity:.7}
.r-opt{font-family:var(--f-mono);font-weight:600;fill:#4f5651}
.emptytx{fill:#7a847e;font-family:var(--f-body)}
.plan-floor{fill:#f4f2ec}
.plan-room{fill:none;stroke:#b9b3a3;stroke-dasharray:var(--dash)}
.plan-wall{fill:#5f6a64;cursor:pointer}
.plan-wall.on{fill:#1b211e}
.plan-lbl{fill:#5f6a64;font-family:var(--f-mono);font-weight:600}
.plan-lbl.on{fill:#1b211e}
.plan-tag{fill:#fff;font-family:var(--f-mono);font-weight:600}
.plan-no{fill:#1b211e}
.plan-up{fill:rgba(219,225,230,.55);stroke:#1b211e;stroke-dasharray:var(--dash)}
.plan-front{stroke:#1b211e}
.plan-ln{stroke:#4f5550;fill:none}
.plan-open{fill:#fbfbf9}
.pf{cursor:grab;touch-action:none}
.hdl{touch-action:none}
.hx{cursor:ew-resize}.hy{cursor:ns-resize}
.grip{fill:#fff;stroke:#2448c9;stroke-width:var(--sw)}
.grip.wl{fill:#fff;stroke:#5f6a64}
.hdl:hover .grip{fill:#2448c9}
.ech{cursor:text}
.ech rect{fill:#2448c9}
.ech text{fill:#fff;font-family:var(--f-mono);font-weight:600}
.ech.gp rect{fill:#fff;stroke:#2448c9;stroke-width:var(--sw)}
.ech.gp text{fill:#2448c9}
.ech:hover rect{fill:#1b211e;stroke:#1b211e}
.ech:hover text{fill:#fff}
.gapln{stroke:#2448c9;stroke-width:var(--sw);stroke-dasharray:calc(var(--sw)*3) calc(var(--sw)*2)}
.edin{position:absolute;transform:translate(-50%,-50%);width:104px;z-index:70;border:2px solid #2448c9;border-radius:7px;background:#fff;color:#1b211e;padding:6px 8px;font:600 16px var(--f-mono);text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.18);color-scheme:light}

/* inspector (rm-ins) */
.insp{display:flex;flex-direction:column;position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:hidden}
.itabs{display:flex;gap:4px;margin:10px 10px 0;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:3px}
.itabs button{flex:1;border:0;background:transparent;padding:7px 6px;border-radius:6px;font-weight:600;color:var(--muted);font-size:13px;white-space:nowrap}
.itabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.ibody{padding:12px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.num{display:inline-flex;align-items:stretch;border:1px solid var(--line2);border-radius:6px;overflow:hidden;background:var(--panel);align-self:flex-start}
.num input{width:76px;border:0;background:transparent;padding:6px 8px;font:600 14px var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.num span{padding:6px 6px 6px 0;font:12px var(--f-mono);color:var(--muted);align-self:center}
.num button{border:0;background:var(--sunk);padding:0 10px;font-weight:600;color:var(--muted)}
.num button:hover{color:var(--accent)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:4px 8px;font:600 12.5px var(--f-mono);font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chip.txt{font-family:var(--f-body);font-weight:600}
.ihead{display:flex;gap:10px;align-items:center}
.ihead .ic{width:48px;height:48px;flex:none;border:1px solid var(--line2);border-radius:8px;background:var(--sunk);display:grid;place-items:center;padding:4px;color:var(--ink)}
.ihead .ic svg{width:100%;height:100%}
.ihead h2{margin:0;font:600 19px/1.1 var(--f-display);letter-spacing:.01em;text-wrap:balance}
.ihead .tg{font:500 12px var(--f-mono);color:var(--muted)}
.segs{display:flex;flex-direction:column;gap:6px}
.segrow{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--sunk)}
.segrow .top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.segrow .top.hd{flex-wrap:nowrap}
.segrow .top.hd select{flex:1;min-width:92px;font-size:12.5px}
.segrow select{border:1px solid var(--line2);border-radius:6px;background:var(--panel);padding:5px 6px;font-size:13px;min-width:0}
.segrow .mm{display:flex;align-items:center;border:1px solid var(--line2);border-radius:6px;background:var(--panel)}
.segrow .mm input{width:48px;border:0;background:transparent;padding:5px 4px 5px 6px;font:600 13px var(--f-mono);text-align:right}
.segrow .mm span{font:11px var(--f-mono);color:var(--muted);padding-right:6px}
.mini{border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:4px 7px;font-size:12px;font-weight:600;line-height:1.2}
.mini:hover{border-color:var(--ink)}
.mini:disabled{opacity:.35}
.mini[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.mini.x{color:var(--bad)}
.segnum{font:600 11px var(--f-mono);color:var(--muted);width:16px}
.empty{color:var(--muted);font-size:13px;line-height:1.5;padding:4px 0;margin:0}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.swatch{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:transparent;padding:0;width:58px}
.swatch i{display:block;width:42px;height:42px;border-radius:8px;border:1px solid var(--line2);box-shadow:inset 0 0 0 3px var(--panel)}
.swatch span{font-size:10.5px;line-height:1.15;text-align:center;color:var(--muted)}
.swatch[aria-pressed="true"] i{outline:2px solid var(--accent);outline-offset:2px}
.swatch[aria-pressed="true"] span{color:var(--ink);font-weight:600}
.looks{display:flex;flex-direction:column;gap:8px}
.look{display:grid;grid-template-columns:38px minmax(0,1fr);gap:4px 10px;align-items:center;padding:8px;border:1px solid var(--line2);border-radius:var(--r);background:var(--panel)}
.look.drop{border-color:var(--accent);background:var(--accent-soft)}
.look b{font-size:13.5px;min-width:0}
.lk-sw{grid-row:span 2;width:38px;height:38px;border-radius:6px;border:1px solid var(--line2);background-size:cover;background-position:center}
.lk-acts{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.lk-acts .btn.sm,.btn.sm{padding:4px 8px;font-size:12px}
.lk-acts .btn.sm.on{border-color:var(--ok);color:var(--ok)}
.lk-col{width:30px;height:28px;padding:0 2px;border:1px solid var(--line2);border-radius:6px;background:var(--panel);cursor:pointer}
.lk-mm{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.lk-mm input{width:58px;border:1px solid var(--line2);border-radius:5px;padding:4px 6px;font:600 12px var(--f-mono);text-align:right;background:var(--panel)}
.xbtn{min-width:26px;height:26px;border:1px solid color-mix(in srgb,var(--bad) 35%,var(--line2));background:var(--bad-bg);color:var(--bad);border-radius:6px;font-size:13px;line-height:1;padding:0}
.lay{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lay button{border:1px solid var(--line2);background:var(--panel);border-radius:8px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600}
.lay button svg{width:44px;height:30px}
.lay button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.lay button path{stroke:currentColor}
hr.sep{border:0;border-top:1px solid var(--line);margin:0}
.spec{display:flex;flex-direction:column;gap:2px}
.spec h4{margin:8px 0 4px;font-size:12px;color:var(--muted);font-weight:600}
.sline{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;padding:6px;border-radius:6px;align-items:center;border:0;background:transparent;text-align:left;width:100%}
.sline:hover{background:var(--sunk)}
.sline .t{width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--panel);display:grid;place-items:center;font:600 10.5px var(--f-mono)}
.sline .n{font-size:13px;font-weight:600;min-width:0}
.sline .n small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.sline .w{font:600 12.5px var(--f-mono);font-variant-numeric:tabular-nums}
.sline.bad .w,.sline.bad .n{color:var(--bad)}
.totals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tot{border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--sunk)}
.tot b{display:block;font:600 17px/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.tot span{font-size:11px;color:var(--muted)}
.form{display:flex;flex-direction:column;gap:8px}
.form input,.form textarea{border:1px solid var(--line2);border-radius:6px;background:var(--panel);padding:8px 10px;width:100%;font-size:14px}
.form textarea{min-height:70px;resize:vertical}
.reqtext{width:100%;min-height:120px;font:12px/1.5 var(--f-mono);border:1px solid var(--line);border-radius:6px;background:var(--sunk);padding:8px;white-space:pre}

/* ghost + tip + toast — Builder's dark tooltip */
.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:60;transform:translate(-50%,-50%);background:var(--panel);border:2px solid var(--accent);border-radius:10px;padding:6px 10px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:13px;font-weight:600}
.ghost svg{width:30px;height:30px}
.tip{position:fixed;left:0;top:0;pointer-events:none;z-index:55;background:rgba(27,33,30,.93);color:#e4e9e5;font:11.5px/1.45 var(--f-body);padding:6px 9px;border-radius:6px;transform:translate(14px,-120%);white-space:pre}
.tip::first-line{font-weight:700;color:#fff}
.tip.bad{background:#b4291f}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 14px;border-radius:8px;font-size:13px;z-index:60;max-width:min(92vw,460px);box-shadow:0 6px 24px rgba(0,0,0,.18)}
#view3d{position:relative;touch-action:none;min-height:300px;background:var(--paper)}
#view3d canvas{display:block;width:100%;cursor:grab}
#view3d canvas:active{cursor:grabbing}
.v3bar{position:absolute;right:10px;top:10px;display:flex;gap:6px}
.v3bar .btn{background:#fff;color:#1b211e;border-color:#c3cac3}
.v3msg{position:absolute;inset:0;display:grid;place-items:center;margin:0;color:#5f6a64;font-size:13px;text-align:center;padding-inline:16px}

@media (max-width:1180px){
  .work{grid-template-columns:190px minmax(0,1fr)}
  .insp{grid-column:1/-1;position:static;max-height:none}
}
@media (max-width:760px){
  .work{grid-template-columns:minmax(0,1fr)}
  .cat{order:2} .insp{order:3}
  .cats{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .cgroup{flex:none;width:200px}
  .brand h1{font-size:20px}
  .swrap{max-height:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<header class="top"><div class="wrap">
  <div class="brand"><div class="logo"><span class="dbl" role="img" aria-label="Dėdės Baldai"></span></div><div><h1 data-tx="title"></h1><div class="sub" data-tx="sub"></div></div></div>
  <div class="grow"></div>
  <div class="tools">

  </div>
</div></header>

<div class="wrap room">
  <div class="bar">
    <div class="seg" id="kindSw" role="group" aria-label="Project"><button type="button" data-kind="kitchen" data-tx="modeK"></button><button type="button" data-kind="robe" data-tx="modeR"></button></div>
    <div class="seg" id="viewSw" role="group" aria-label="View"><button type="button" data-view="wall" data-tx="vFront"></button><button type="button" data-view="plan" data-tx="vPlan"></button><button type="button" data-view="3d">3D</button></div>
    <div class="seg wtabs" id="wtabs" role="group"></div>

          <div id="elevWrap"></div>
          <div id="planWrap" hidden></div>

        <div class="zoom" id="zoom"><button type="button" data-z="in" aria-label="+">+</button><button type="button" data-z="out" aria-label="−">−</button><button type="button" data-z="fit" aria-label="⤢">⤢</button></div>

</div>

<script>
'use strict';

function mk(t,wall,x,extra){
  const c=CAT[t]; const it={id:uid(),t,layer:c.layer,wall,x,w:c.w};
  if(c.segs) it.segs=clone(c.segs);
  if(c.cols){it.cols=clone(c.cols); it.doors=c.doors; if(c.panels)it.panels=c.panels; it.d=c.d;}
  if(c.h) it.h=c.h; if(c.y0!=null) it.y0=c.y0; if(c.hg) it.hg=c.hg;
  return Object.assign(it,extra||{});
}

    case 'base':return [d.plinth,d.plinth+(it.h||d.baseH)];
    case 'wall':{const tp=wallTop(); return [tp-(it.h||d.wallH),tp];}

  const sign=d=>`<path class="rm-open" d="${d}" stroke-width="${PX(.9)}" stroke-dasharray="${PX(4)} ${PX(3)}"/>`;
  const P=(a,b)=>r1(a)+' '+r1(b);

    if(S.handle==='knob') return knob(hx,top?y+65:y+h-65);
    return metalV(hx,top?y+45+L/2:y+h-45-L/2,L); };
  const hH=(cx,hy)=>{ if(S.handle==='gola')return ''; if(S.handle==='knob') return knob(cx,hy); return metalH(cx,hy,Math.min(220,w*0.42)); };
  const gola=()=>S.handle==='gola'?`<rect x="${r1(x)}" y="${r1(y)}" width="${r1(w)}" height="18" fill="#2d3034" opacity=".55"/>`:'';

    case 'door':{
      if(sg.n===2){const hw=(w-4)/2, a=x, b=x+hw+4;
        return panel(a,hw)+panel(b,hw)+gola()+sign(`M${P(a,y)} L${P(a+hw,y+h/2)} L${P(a,y+h)}`)+sign(`M${P(b+hw,y)} L${P(b,y+h/2)} L${P(b+hw,y+h)}`)+vH(a+hw-40)+vH(b+40);}

    }
    case 'lift': return panel(x,w)+sign(`M${P(x,y)} L${P(x+w/2,y+h)} L${P(x+w,y)}`)+hH(x+w/2,y+h-40);
    case 'open':{
      let s=lookPaint('carc',x,y,w,h)+`<rect x="${r1(x)}" y="${r1(y)}" width="${r1(w)}" height="${r1(h)}" fill="none" stroke="${EDGE}" stroke-width="${sw}"/><rect x="${r1(x+18)}" y="${r1(y+18)}" width="${r1(w-36)}" height="${r1(h-36)}" fill="#cfcbc2" opacity=".75"/><rect x="${r1(x+18)}" y="${r1(y+18)}" width="${r1(w-36)}" height="${r1(Math.min(80,h*0.2))}" fill="url(#gUnder)"/>`;
      const k=h>520?3:2; for(let i=1;i<k;i++){const yy=y+h*i/k; s+=`<rect x="${r1(x+18)}" y="${r1(yy-9)}" width="${r1(w-36)}" height="18" fill="${lookColor('carc')}" stroke="${EDGE}" stroke-width="${PX(.6)}"/><rect x="${r1(x+18)}" y="${r1(yy+9)}" width="${r1(w-36)}" height="40" fill="url(#gUnder)"/>`;}

    case 'oven':
      return `<rect x="${r1(x)}" y="${r1(y)}" width="${r1(w)}" height="${r1(h)}" fill="#26282a" stroke="${EDGE}" stroke-width="${sw}"/>`+
        `<rect x="${r1(x)}" y="${r1(y)}" width="${r1(w)}" height="${r1(Math.min(90,h*0.17))}" fill="#3a3d3f"/>`+
        `<circle cx="${r1(x+w*0.22)}" cy="${r1(y+Math.min(45,h*0.085))}" r="12" fill="url(#gMetal)"/><circle cx="${r1(x+w*0.78)}" cy="${r1(y+Math.min(45,h*0.085))}" r="12" fill="url(#gMetal)"/>`+

function chipSVG(x,y,val,ed,i,anchor,fs,gap){
  const f=fs*0.92, txt=String(Math.round(val)), w=txt.length*f*0.62+f*1.1, h=f*1.55;

  return `<g class="ech${gap?' gp':''}" data-ed="${ed}"${i!=null?` data-i="${i}"`:''} data-v="${Math.round(val)}"><rect x="${r1(x0)}" y="${r1(y-h/2)}" width="${r1(w)}" height="${r1(h)}" rx="${r1(h/2)}"/><text x="${r1(x0+w/2)}" y="${r1(y+f*0.36)}" font-size="${r1(f)}" text-anchor="middle">${txt}</text></g>`;
}
function gapRefs(it){

    if(robeOpen(it)){const ci=Math.min(U.col||0,xs.length-1), a=xs[ci][0], mm=compMM(it,ci); let y=Y+BD; mm.forEach((h,i)=>{ if(h>fs*1.6) s+=chipSVG(X+a+fs*0.6,y+h/2,h,'cseg',ci*100+i,'start',fs,false); y+=h+BD;});}}

function handlesSVG(it){

  if(bad){const g=freeGaps(tmp,wall).find(([a,b])=>along>=a&&along<=b); if(g&&g[1]-g[0]>=limW(tmp)[0]&&g[1]-g[0]<tmp.w){fit=Math.floor(g[1]-g[0]); tmp.x=Math.round(g[0]); tmp.w=fit; bad=isBad(tmp);}}
  PD.cand={x:tmp.x,w:tmp.w,bad,fit,wall,run};

  if(pv) pv.innerHTML=`<rect class="${bad?'pv-bad':'pv-ok'}" x="${tmp.x}" y="${H-y1}" width="${tmp.w}" height="${y1-y0}"/>`;
  tipL(e,{bad,lines:[`${nm(CAT[PD.t])} → ${t('wall')} ${wall} · ${t('fromStart').replace('{x}',tmp.x)}`+(sn.why&&!fit?' · '+t('snap_'+sn.why):''), run?t('wtRun').replace('{w}',tmp.w):fit?t('fitTo').replace(/\{w\}/g,fit):bad?t('hit'):t('dropAdd')]});

/* ---------------- drag to resize ---------------- */
const STDW=[300,400,450,500,600,800,900,1000,1200];
const WSTD=[360,580,720,900];
let RD=null;
function limW(it){return it.layer==='window'?[300,4000]:it.layer==='door'?[600,1400]:it.layer==='top'?[200,6000]:it.layer==='robe'?[400,4000]:[150,1500];}
function neigh(it){let iv=[]; for(const o of OCC[it.layer]) iv=iv.concat(intervals(it.wall,o,it.id)); return iv;}
function edgesOn(it){const c=[]; for(const o of S.items) if(o.wall===it.wall&&o.id!==it.id) c.push(o.x,o.x+o.w); for(const k of corners(it.wall)) c.push(k.a,k.b); return c;}
function nearest(v,c,tol){let b=null,bd=tol; for(const x of c){const d=Math.abs(x-v); if(d<=bd){bd=d;b=x;}} return b;}
function tip(e,txt){const el=$('#tip'); if(!txt){el.hidden=true; return;} el.classList.remove('bad'); el.textContent=txt; el.style.left=e.clientX+'px'; el.style.top=e.clientY+'px'; el.hidden=false;}
function startResize(e,hd){
  const h=hd.dataset.h, it=h==='wall'?null:byId(U.sel);
  if(h!=='wall'&&!it)return;
  RD={h,i:+hd.dataset.i,id:it&&it.id,cx:e.clientX,cy:e.clientY,k:K,moved:false,L0:S.walls[U.wall],wall:U.wall};
  if(it){RD.x0=it.x; RD.w0=it.w; RD.h0=(it.layer==='window'||it.layer==='door')?it.h:Math.round(hOf(it)); RD.y00=it.y0; if(it.segs){RD.mm0=segMM(it); RD.r0=it.segs.map(q=>q.r);}
    if(it.cols&&h==='cseg'){const ci=Math.floor(RD.i/100); RD.mm0=compMM(it,ci); RD.r0=it.cols[ci].segs.map(q=>q.r);}
    if(it.cols&&h==='col'){RD.cw0=colsMM(it); RD.cr0=it.cols.map(c=>c.r);}}
  try{$('#elevWrap').setPointerCapture(e.pointerId);}catch(_){}
  e.preventDefault();
}
function rdMove(e){
  if(!RD)return;
  if(!RD.moved){if(Math.hypot(e.clientX-RD.cx,e.clientY-RD.cy)<3)return; RD.moved=true; snapshot();}
  const dx=(e.clientX-RD.cx)*RD.k, dy=(e.clientY-RD.cy)*RD.k, tol=Math.max(25,8*RD.k);
  let label='';
  if(RD.h==='wall'){
    const w=RD.wall; let mn=600; for(const o of S.items) if(o.wall===w) mn=Math.max(mn,o.x+o.w);
    S.walls[w]=Math.max(Math.ceil(mn),Math.min(12000,Math.round((RD.L0+dx)/10)*10));
    label=`${t('wall')} ${w}: ${S.walls[w]} mm`; renderTabs();
  } else {
    const it=byId(RD.id); if(!it)return; const L=S.walls[it.wall], lim=limW(it);
    if(RD.h==='R'){
      let maxR=L; for(const [a] of neigh(it)) if(a>RD.x0+0.5) maxR=Math.min(maxR,a);
      let r=RD.x0+RD.w0+dx; const sn=nearest(r,[L,maxR,...edgesOn(it)],tol);
      if(sn!=null) r=sn; else {const sw=nearest(r-RD.x0,STDW,Math.max(15,5*RD.k)); r=sw!=null?RD.x0+sw:Math.round(r/10)*10;}
      r=Math.min(maxR,RD.x0+lim[1],Math.max(RD.x0+lim[0],r));
      it.w=Math.round(r-RD.x0); label=`${t('width')}: ${it.w} mm`;
    } else if(RD.h==='L'){
      const R0=RD.x0+RD.w0; let minL=0; for(const [,b] of neigh(it)) if(b<R0-0.5) minL=Math.max(minL,b);
      let l=RD.x0+dx; const sn=nearest(l,[0,minL,...edgesOn(it)],tol);
      if(sn!=null) l=sn; else {const sw=nearest(R0-l,STDW,Math.max(15,5*RD.k)); l=sw!=null?R0-sw:Math.round(l/10)*10;}
      l=Math.max(minL,R0-lim[1],Math.min(R0-lim[0],l));
      it.x=Math.round(l); it.w=Math.round(R0-it.x); label=`${t('width')}: ${it.w} mm`;
    } else if(RD.h==='seg'){
      const i=RD.i, a=RD.mm0[i], b=RD.mm0[i+1], tot=a+b;
      let hi=Math.round((a+dy)/10)*10; hi=Math.max(60,Math.min(tot-60,hi)); const hj=tot-hi;
      const rs=RD.r0[i]+RD.r0[i+1]; it.segs[i].r=rs*hi/tot; it.segs[i+1].r=rs*hj/tot;
      label=`${i+1}: ${Math.round(hi)} · ${i+2}: ${Math.round(hj)} mm`;
    } else if(RD.h==='bot'&&it.layer==='wall'){
      const d=S.dims, maxH=wallTop()-(d.plinth+d.baseH+d.top);
      let h=RD.h0+dy; const sn=nearest(h,WSTD,Math.max(20,6*RD.k)); h=sn!=null?sn:Math.round(h/10)*10;
      it.h=Math.max(200,Math.min(maxH,h)); label=`${t('height')}: ${it.h} mm`;
    } else if(RD.h==='bot'&&it.layer==='window'){
      const top=RD.y00+RD.h0; let y0=Math.round((RD.y00-dy)/10)*10; y0=Math.max(0,Math.min(top-300,y0));
      it.y0=y0; it.h=top-y0; label=`${t('sill')}: ${it.y0} mm`;
    } else if(RD.h==='cseg'){
      const ci=Math.floor(RD.i/100), i=RD.i%100, a=RD.mm0[i], b=RD.mm0[i+1], tot=a+b;
      let hi=Math.round((a+dy)/10)*10; hi=Math.max(100,Math.min(tot-100,hi)); const hj=tot-hi, rs=RD.r0[i]+RD.r0[i+1];
      it.cols[ci].segs[i].r=rs*hi/tot; it.cols[ci].segs[i+1].r=rs*hj/tot;
      label=`${i+1}: ${Math.round(hi)} · ${i+2}: ${Math.round(hj)} mm`;
    } else if(RD.h==='col'){
      const i=RD.i, a=RD.cw0[i], b=RD.cw0[i+1], tot=a+b;
      let wi=Math.round((a+dx)/10)*10; wi=Math.max(200,Math.min(tot-200,wi)); const wj=tot-wi, rs=RD.cr0[i]+RD.cr0[i+1];
      it.cols[i].r=rs*wi/tot; it.cols[i+1].r=rs*wj/tot;

    if(it.id===U.sel){
      const ya=(it.layer==='base'||it.layer==='tall'||it.layer==='robe')?0:y0, dd=Math.max(D,60)+(it.layer==='robe'?50:0);
      const ln=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(W+16,(y1-ya)+16,dd+30)),new THREE.LineBasicMaterial({color:acc}));
      ln.position.set(X+W/2,(ya+y1)/2,dd/2+5); g.add(ln);
    }
  }
  // camera fit + light
  const maxX=A, span=Math.max(maxX-m0,depth)/1000, cx=(m0+maxX)/2000, cz=depth/2000;
  const key=S.layout+'|'+A+'|'+B+'|'+C;
  if(G3.fitKey!==key){G3.fitKey=key; G3.orb.t.set(cx,1.05,cz); G3.orb.r=span*1.2+2.4; G3.orb.ph=1.08; G3.orb.th=S.layout==='I'?0:S.layout==='L'?-0.7:-Math.PI/2+0.25;}
  const dl=G3.dir; dl.position.set(cx-2.2,4.6,cz+3.2); dl.target.position.set(cx,0.6,cz);
  const sc=dl.shadow.camera, ext=span*0.9+1; sc.left=-ext; sc.right=ext; sc.top=ext; sc.bottom=-ext; sc.near=0.5; sc.far=20; sc.updateProjectionMatrix();
}
function draw3D(){
  if(!G3||U.view!=='3d')return;
  cancelAnimationFrame(raf3);
  raf3=requestAnimationFrame(()=>{
    const host=$('#view3d'), w=host.clientWidth; if(!w)return;
    const h=Math.round(Math.min(window.innerHeight*0.62,Math.max(300,w*0.6)));
    const R=G3.R, sz=R.getSize(new THREE.Vector2());
    if(sz.x!==w||sz.y!==h){R.setSize(w,h); G3.cam.aspect=w/h; G3.cam.updateProjectionMatrix();}
    const o=G3.orb;
    G3.cam.position.set(o.t.x+o.r*Math.sin(o.ph)*Math.sin(o.th),o.t.y+o.r*Math.cos(o.ph),o.t.z+o.r*Math.sin(o.ph)*Math.cos(o.th));
    G3.cam.lookAt(o.t); R.render(G3.scene,G3.cam);
  });
}
const clampR=r=>Math.max(1.2,Math.min(25,r));
function bindOrbit(el){
  const pts=new Map(); let dn=null, pinch=null;
  el.addEventListener('pointerdown',e=>{
    try{el.setPointerCapture(e.pointerId);}catch(_){}
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1) dn={x:e.clientX,y:e.clientY,pan:e.button===2||e.shiftKey,moved:false};
    if(pts.size===2){const [a,b]=[...pts.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y),r:G3.orb.r}; if(dn)dn.moved=true;}
  });
  el.addEventListener('pointermove',e=>{
    const p=pts.get(e.pointerId); if(!p)return;
    const dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY;
    if(dn&&Math.hypot(e.clientX-dn.x,e.clientY-dn.y)>4) dn.moved=true;
    const o=G3.orb;
    if(pts.size>=2&&pinch){const [a,b]=[...pts.values()]; o.r=clampR(pinch.r*pinch.d/Math.max(1,Math.hypot(a.x-b.x,a.y-b.y)));}
    else if(dn&&dn.pan){const s=o.r*0.0016, right=new THREE.Vector3().setFromMatrixColumn(G3.cam.matrix,0); o.t.addScaledVector(right,-dx*s); o.t.y=Math.max(0,Math.min(3,o.t.y+dy*s));}
    else {o.th-=dx*0.008; o.ph=Math.max(0.2,Math.min(1.52,o.ph-dy*0.006));}
    draw3D();
  });
  const end=e=>{
    if(!pts.has(e.pointerId))return; pts.delete(e.pointerId); if(pts.size<2)pinch=null;
    if(e.type==='pointerup'&&!pts.size&&dn&&!dn.moved) pick3D(e);
    if(!pts.size) dn=null;
  };
  el.addEventListener('pointerup',end); el.addEventListener('pointercancel',end);
  el.addEventListener('wheel',e=>{e.preventDefault(); G3.orb.r=clampR(G3.orb.r*(1+Math.sign(e.deltaY)*Math.min(0.25,Math.abs(e.deltaY)*0.0012))); draw3D();},{passive:false});
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
function pick3D(e){
  const el=G3.R.domElement, r=el.getBoundingClientRect();
  const m=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  const rc=new THREE.Raycaster(); rc.setFromCamera(m,G3.cam);
  for(const h of rc.intersectObjects(G3.root.children,true)){
    let o=h.object; while(o&&!o.userData.id)o=o.parent;
    if(o){const it=byId(o.userData.id); if(it){if(U.sel!==it.id)U.col=0; U.sel=it.id; U.wall=it.wall; if(isCab(it))U.tab='cab'; render();} return;}
  }
  if(U.sel){U.sel=null; render();}
}
const FACE={A:0,B:-Math.PI/2,C:Math.PI};
function setView(v){
  U.view=v; renderTabs(); if(v==='3d') show3D(); else if(v==='plan') renderPlan(); else renderElev();
}
$('#zoom').addEventListener('click',e=>{const b=e.target.closest('[data-z]'); if(!b)return; const z=U.zoom||1;
  U.zoom=b.dataset.z==='in'?Math.min(4,z*1.25):b.dataset.z==='out'?Math.max(1,z/1.25):1;
  if(U.view==='plan')renderPlan(); else renderElev();});
$('#viewSw').addEventListener('click',e=>{const b=e.target.closest('[data-view]'); if(b&&b.dataset.view!==U.view) setView(b.dataset.view);});
$('#v3reset').addEventListener('click',()=>{if(G3){G3.fitKey=''; sched3D();}});
$('#wtabs').addEventListener('click',e=>{const b=e.target.closest('[data-wall]'); if(b&&U.view==='3d'&&G3){G3.orb.th=FACE[b.dataset.wall]; G3.orb.ph=1.2; draw3D();}});
render();
</script>
